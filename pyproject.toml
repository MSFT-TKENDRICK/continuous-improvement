[project]
name = "order-support-evals"
version = "0.2.0"
description = "Microsoft ASSERT evals for a tool-using order-support agent, with judge-vs-reference-label calibration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "assert-ai>=0.3.0,<0.4",
    "litellm>=1.84.1,<2",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
]

[project.scripts]
order-support-evals = "order_support.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a running OpenAI-compatible model server (see README)",
]
addopts = "-m 'not live'"
