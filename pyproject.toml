[project]
name = "s1eval"
version = "0.1.0"
description = "System One-style (Jev / OpenAI Decisions / local logprob) judge evals with judge-the-judge validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
typesafe = ["typesafe-sdk>=0.7.2"]
openai = ["openai>=2.0"]
langsmith = ["langsmith>=0.4"]

[project.scripts]
s1eval = "s1eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "typesafe-sdk>=0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s1eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a running llama-server (set S1EVAL_LLAMA_URL)",
]
addopts = "-m 'not live'"
