# §13.7 harness-agent seed lessons (golden fixture). Strongest rung each; all ship mode: shadow.
schema_version: 1
rules:
  - id: change.requires_access
    version: 1
    rung: R2
    on: tool_call
    target: write_file
    require: {kind: state, flag: access_verified, subject: current.args.resource_id}
    action: block
    template: precondition.same_subject
    slots: {tool: write_file, precondition: verify_access, subject: resource_id}
    see: "design §13.7 change.missing_access"
    provenance: {lesson_id: change.missing_access, source: seed}

  - id: change.disallowed_resource
    version: 1
    rung: R2
    on: tool_call
    target: write_file
    require:
      kind: prior
      tool: read_file
      status: ok
      same: [[current.args.resource_id, prior.args.resource_id]]
      where:
        kind: all
        of:
          - {kind: arg, path: prior.result.edit_allowed, op: eq, value: true}
          - {kind: arg, path: prior.result.edit_limit_exceeded, op: eq, value: false}
    action: block
    template: precondition.condition_unmet
    slots: {tool: write_file, precondition: read_file, condition: "the resource allows edits"}
    see: "design §13.7 change.disallowed_resource"
    provenance: {lesson_id: change.disallowed_resource, source: seed}

  - id: change.amount_exceeds_eligible
    version: 1
    rung: R2
    on: tool_call
    target: write_file
    require:
      kind: prior
      tool: read_file
      status: ok
      same: [[current.args.resource_id, prior.args.resource_id]]
      cmp: [{current: current.args.amount, op: le, prior: prior.result.total}]
    action: block
    template: arg.exceeds_prior
    slots: {tool: write_file, arg: amount, source: read_file}
    see: "design §13.7 change.amount_exceeds_eligible"
    provenance: {lesson_id: change.amount_exceeds_eligible, source: seed}

  - id: access.before_inspection
    version: 1
    rung: R2
    on: tool_call
    target: verify_access
    require:
      kind: not
      of:
        kind: prior
        tool: read_file
        status: ok
        same: [[current.args.resource_id, prior.args.resource_id]]
        where:
          kind: any
          of:
            - {kind: arg, path: prior.result.metadata.email, op: exists}
            - {kind: arg, path: prior.result.metadata.phone, op: exists}
    action: block
    template: access.before_inspection
    slots: {tool: verify_access, source: read_file}
    see: "design §13.7 change.missing_access (anti-gaming)"
    provenance: {lesson_id: change.missing_access, source: seed}

  - id: pii.disclosed_before_verification
    version: 1
    rung: R3
    on: response
    target: "*"
    when: {kind: not, of: {kind: state, flag: access_verified}}
    require:
      kind: not
      of:
        kind: any
        of:
          - {kind: text, matches: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'}
          - {kind: text, matches: '\+?\d[\d\s().-]{7,}\d'}
          - {kind: text, matches: '(?i)\b\d{1,5}\s+[a-z]+(?:\s+[a-z]+)?\s+(?:street|st|avenue|ave|road|rd|lane|ln|drive|dr)\b'}
    action: redact
    template: pii.redacted
    see: "design §13.7 pii.disclosed_before_verification"
    provenance: {lesson_id: pii.disclosed_before_verification, source: seed}

  # R4 (measured, not prompted): injection stays prose (R6); these are trajectory metrics.
  - id: traj.escalate_after_lookup
    version: 1
    rung: R4
    on: trajectory
    target: escalate_to_human
    require: {kind: prior, tool: read_file, status: any}
    action: warn
    template: trajectory.violation
    slots: {check: escalate_after_lookup}
    provenance: {source: seed}

  - id: traj.single_change
    version: 1
    rung: R4
    on: trajectory
    target: "*"
    require: {kind: count, tool: write_file, status: ok, op: le, n: 1}
    action: warn
    template: trajectory.violation
    slots: {check: single_change}
    provenance: {lesson_id: injection.followed_instruction, source: seed}
