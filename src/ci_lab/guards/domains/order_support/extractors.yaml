# Frozen state-flag extractors for order support (design §13.7, B5). Domain config owned by
# frozen code, NOT arm surface: identity_verified is set only by a successful structured
# verify_identity result (never from model or user text).
schema_version: 1
extractors:
  - flag: identity_verified
    tool: verify_identity
    result_path: result.verified
    equals: true
    subject: args.order_id
    ttl_steps: 50
