# Meta-agent manifest (M8a). runtime=harness: each spec is parsed declaratively and run through
# MAF create_harness_agent (ci_lab.maf.loader.build_agent(..., runtime="harness")).
# `model` is an alias resolved by contracts.ChatClientFactory; tool sets are bound per run by
# ci_lab.meta.run. Spec paths are relative to this file, except for the `evolvable` agents below,
# whose specs (and prompts) live in the self-hosted harness tree: <harness_dir>/agents/<spec>, where
# harness_dir is passed explicitly (default: the repo-root harness/, see ci_lab.harness_tree).
# critic, judge, adversary and this manifest stay frozen here.
version: 1
runtime: harness
# Default model for every meta agent and subagent. Operators may pick another one per run with
# CI_META_MODEL (applied before validation and hashing, so provenance records the real model);
# it must be in allowed_models, which only the CI_ALLOWED_MODELS env (comma-separated) can extend.
model: claude-sonnet-5
allowed_models: [claude-sonnet-5, claude-sonnet-5.5, claude-opus-5, gpt-5.5]  # enforced via ci_lab.maf.specs
harness:
  disable_todo: true
  disable_mode: true
  disable_file_memory: true
  disable_web_search: true
  max_nudges: 2  # re-prompts when a run ends without the terminal submit_* call
evolvable: [analyst, proposer, reflector, failure_analyst, student]
agents:
  analyst:
    spec: analyst.yaml
    purpose: analyst
    terminal_tool: submit_analysis
  proposer:
    spec: proposer.yaml
    purpose: proposer
    terminal_tool: submit_proposal_done
  critic:
    spec: critic.yaml
    purpose: critic
    terminal_tool: submit_verdict
  reflector:
    spec: reflector.yaml
    purpose: reflector
    terminal_tool: submit_reflection
# Read-only subagents (x-ci role: subagent). Referenced from an agent's x-ci.subagents and run
# as MAF background agents (create_harness_agent(background_agents=...)) on the parent's client.
subagents:
  failure_analyst:
    spec: failure_analyst.yaml
