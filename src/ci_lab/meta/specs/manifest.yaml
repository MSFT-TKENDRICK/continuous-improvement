# Meta-agent manifest (M8a). runtime=harness: each spec is parsed declaratively and run through
# MAF create_harness_agent (ci_lab.maf.loader.build_agent(..., runtime="harness")).
# `model` is an alias resolved by contracts.ChatClientFactory; tool sets are bound per run by
# ci_lab.meta.run. Spec paths are relative to this file.
version: 1
runtime: harness
model: claude-sonnet-4.5
allowed_models: [claude-sonnet-4.5]  # model allowlist, enforced via ci_lab.maf.specs
harness:
  disable_todo: true
  disable_mode: true
  disable_file_memory: true
  disable_web_search: true
  max_nudges: 2  # re-prompts when a run ends without the terminal submit_* call
agents:
  analyst:
    spec: analyst.yaml
    purpose: analyst
    terminal_tool: submit_analysis
  proposer:
    spec: proposer.yaml
    purpose: proposer
    terminal_tool: submit_proposal_done
  critic:
    spec: critic.yaml
    purpose: critic
    terminal_tool: submit_verdict
  reflector:
    spec: reflector.yaml
    purpose: reflector
    terminal_tool: submit_reflection
