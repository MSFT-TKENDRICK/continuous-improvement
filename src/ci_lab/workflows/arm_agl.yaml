# One RRSI arm, strategy `agl` (LLM-only structural Agent Lightning optimizer).
# The frozen control workflow matches other non-agent strategies; candidate target workflows
# remain under harness/workflows/.
kind: Workflow
trigger:
  kind: OnConversationStart
  id: rrsi_arm_agl
  actions:
    - kind: InvokeFunctionTool
      id: provision_slot
      functionName: provision_slot
      arguments:
        step: provision_slot
    - kind: InvokeFunctionTool
      id: propose
      functionName: propose
      arguments:
        strategy: agl
    - kind: InvokeFunctionTool
      id: critique_1
      functionName: critique
      arguments:
        attempt: 1
    - kind: InvokeFunctionTool
      id: repair_1
      functionName: repair
      arguments:
        attempt: 1
    - kind: InvokeFunctionTool
      id: critique_2
      functionName: critique
      arguments:
        attempt: 2
    - kind: InvokeFunctionTool
      id: repair_2
      functionName: repair
      arguments:
        attempt: 2
    - kind: InvokeFunctionTool
      id: critique_final
      functionName: critique
      arguments:
        attempt: 3
    - kind: InvokeFunctionTool
      id: evaluate
      functionName: evaluate
      arguments:
        split: evolve
    - kind: InvokeFunctionTool
      id: finalize_arm
      functionName: finalize_arm
      arguments:
        step: finalize_arm
