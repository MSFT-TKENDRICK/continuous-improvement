# One RRSI arm, strategy `agent` (MAF Proposer agent); design C5, section 11.2.
# Shares critique -> repair -> evaluate -> finalize with the other arm_*.yaml.
# Repairs are unrolled declaratively: repair_N is a no-op when critique_N passed,
# else it re-invokes the Proposer with the critic's reasons. Every gate is an
# idempotent Python function that is a no-op once its durable run-dir marker exists.
kind: Workflow
trigger:
  kind: OnConversationStart
  id: rrsi_arm_agent
  actions:
    - kind: InvokeFunctionTool
      id: provision_slot
      functionName: provision_slot
      arguments:
        step: provision_slot
    - kind: InvokeAzureAgent
      id: proposer
      agent:
        name: Proposer
      input:
        messages: "Read your brief and directive with your tools, make your tagged edits, then call submit_proposal."
    - kind: InvokeFunctionTool
      id: critique_1
      functionName: critique
      arguments:
        attempt: 1
    - kind: InvokeFunctionTool
      id: repair_1
      functionName: repair
      arguments:
        attempt: 1
    - kind: InvokeFunctionTool
      id: critique_2
      functionName: critique
      arguments:
        attempt: 2
    - kind: InvokeFunctionTool
      id: repair_2
      functionName: repair
      arguments:
        attempt: 2
    - kind: InvokeFunctionTool
      id: critique_final
      functionName: critique
      arguments:
        attempt: 3
    - kind: InvokeFunctionTool
      id: evaluate
      functionName: evaluate
      arguments:
        split: evolve
    - kind: InvokeFunctionTool
      id: finalize_arm
      functionName: finalize_arm
      arguments:
        step: finalize_arm
