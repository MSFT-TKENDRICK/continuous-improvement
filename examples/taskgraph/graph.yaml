# Diamond task graph: brief -> (inventory, risks) -> summary.
# Offline smoke: the `fake` student writes the first fenced block of each deliverable's instructions.
id: harness-change-review
goal: Review a proposed harness change and summarize its affected components and risks.
deliverables:
  - id: brief
    title: Review brief
    output: {kind: file, path: out/brief.md}
    rubric_commitment: 76a3ab0b7ced024ca0e1d70d41a088c1be73a3b3b0338d74a7ffe746c086b5b5
    budget: {max_attempts: 2, timeout_s: 120}
    instructions: |
      Write the review brief for the proposed harness change. Reference output:
      ```
      # Brief
      Scope: prompt and loop components.
      ```
  - id: inventory
    title: Component inventory
    depends_on: [brief]
    output: {kind: json, path: out/inventory.json}
    rubric_commitment: 15429bd623c1c571f0ab07dc50515a601e2f7a96532936c9158ee24695159cf7
    budget: {max_attempts: 2, timeout_s: 120}
    instructions: |
      From the brief, produce a JSON object with the component names in scope. Reference output:
      ```
      {"components": ["prompt", "loop"]}
      ```
  - id: risks
    title: Harness risks
    depends_on: [brief]
    output: {kind: file, path: out/risks.md}
    rubric_commitment: e164ab1b6953fc15592bc8fa6e104caf950bf84473ed4443d6729469cd08fc9a
    budget: {max_attempts: 2, timeout_s: 120}
    instructions: |
      From the brief, list the open risks as a markdown list. Reference output:
      ```
      # Risks
      - loop: call cap may increase
      ```
  - id: summary
    title: Review summary
    depends_on: [inventory, risks]
    output: {kind: file, path: out/summary.md}
    rubric_commitment: d984df40d9566aa4739a5a2e5b3963a8cb755dc32f629de033e8175c868d52c9
    budget: {max_attempts: 2, timeout_s: 120}
    instructions: |
      Combine the inventory and risks into a two-line summary. Reference output:
      ```
      # Summary
      2 components reviewed; 1 risk open.
      ```
