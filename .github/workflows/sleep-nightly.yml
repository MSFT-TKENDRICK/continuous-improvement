# SkillOpt-Sleep nightly (design C10, §11.3). Four jobs:
#   opt_in   - no permissions: no-op with a notice unless repo variable CI_HARNESS_ENABLED is 'true'
#   gate     - read-only: enough NEW reviewed tasks since last night? (usage threshold)
#   evaluate - read-only + copilot-requests: run one night, emit a digest-pinned bundle
#   publish  - write: stdlib-only validator applies the bundle to a branch and opens a DRAFT PR
# Nothing is ever merged automatically; state.json advances only when a human merges the PR.
name: sleep-nightly

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch: {}

concurrency:
  group: sleep-nightly
  cancel-in-progress: false

permissions: {}

jobs:
  # Opt-in (docs/template.md): the template and every repository created from it run nothing
  # (scheduled or dispatched) until the repository variable CI_HARNESS_ENABLED is 'true'.
  opt_in:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      enabled: ${{ steps.opt_in.outputs.enabled }}
    steps:
      - id: opt_in
        env:
          CI_HARNESS_ENABLED: ${{ vars.CI_HARNESS_ENABLED }}
        run: |
          if [ "$CI_HARNESS_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=CI harness not enabled::$GITHUB_WORKFLOW did nothing. Set the repository variable CI_HARNESS_ENABLED=true to opt in (docs/template.md)."
          fi

  gate:
    needs: opt_in
    if: needs.opt_in.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      new_reviewed: ${{ steps.gate.outputs.new_reviewed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # uv.lock is intentionally not committed (it is generated against an internal package proxy),
      # so `uv sync` resolves from pyproject.toml and cannot use --frozen/--locked.
      - run: uv sync
      - id: gate
        env:
          SLEEP_USAGE_THRESHOLD: ${{ vars.SLEEP_USAGE_THRESHOLD }}
          SLEEP_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: uv run ci-lab sleep usage-gate

  evaluate:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      accepted: ${{ steps.night.outputs.accepted }}
      ledger_update: ${{ steps.night.outputs.ledger_update }}
      status: ${{ steps.night.outputs.status }}
    steps:
      - name: Run dir
        run: echo "CI_RUN_DIR=$RUNNER_TEMP/sleep-run" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # uv.lock is intentionally not committed (it is generated against an internal package proxy),
      # so `uv sync` resolves from pyproject.toml and cannot use --frozen/--locked.
      - run: uv sync
      - name: Verify SkillOpt-Sleep v0.2.x
        run: >-
          uv run python -c "from importlib.metadata import version;
          v=version('skillopt'); assert v.startswith('0.2.'), v"
      - name: Start agl-server (loopback, random key)
        run: |
          key="$(openssl rand -hex 24)"
          echo "::add-mask::$key"
          echo "CI_LAB_AGL_KEY=$key" >> "$GITHUB_ENV"
          echo "CI_LAB_AGL_URL=http://127.0.0.1:4747" >> "$GITHUB_ENV"
          mkdir -p "$CI_RUN_DIR"
          CI_LAB_AGL_KEY="$key" nohup uv run python -m agentlightning.server host=127.0.0.1 port=4747 \
            'key=${oc.env:CI_LAB_AGL_KEY}' hydra.run.dir=. hydra.output_subdir=null \
            hydra/job_logging=disabled hydra/hydra_logging=disabled > "$CI_RUN_DIR/agl-server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4747/healthz > /dev/null && exit 0
            sleep 1
          done
          echo "agl-server did not become healthy" >&2
          exit 1
      - id: night
        name: Run one SkillOpt-Sleep night
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          CI_LAB_SLEEP_TARGET_MODEL: ${{ vars.CI_LAB_SLEEP_TARGET_MODEL || 'gpt-5-mini' }}
          CI_LAB_SLEEP_REFLECTOR_MODEL: ${{ vars.CI_LAB_SLEEP_REFLECTOR_MODEL || 'gpt-5-mini' }}
          CI_LAB_TARGET_MODEL: ${{ vars.CI_LAB_TARGET_MODEL || 'gpt-5-mini' }}
          CI_LAB_JUDGE_MODEL: ${{ vars.CI_LAB_JUDGE_MODEL || 's1/llamacpp/qwen3.5-4b' }}
          CI_S1_LLAMA_URL: ${{ vars.CI_S1_LLAMA_URL }}
          # HOOK(M16) lessons mining: OFF unless the repo variable SLEEP_LESSONS is 1/true. Candidates
          # land in the bundle as experiments/sleep/lessons/<night>.json proposals (draft PR only);
          # they are never adopted or enforced automatically (design §13.3, B8).
          SLEEP_LESSONS: ${{ vars.SLEEP_LESSONS }}
          # Harness target OTel opt-in (auto|1|true|on) for candidate replay/evaluation.
          CI_TELEMETRY: ${{ vars.CI_TELEMETRY }}
        run: uv run ci-lab sleep run --profile copilot --out out/sleep-bundle --run-dir "$CI_RUN_DIR" --max-minutes 60
      - name: Redact night spans (replay with `ci-lab telemetry import`)
        if: ${{ !cancelled() }}
        run: uv run ci-lab sleep redact-spans --run-dir "$CI_RUN_DIR" --out out/spans/spans-redacted.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sleep-bundle
          path: out/sleep-bundle/
          if-no-files-found: ignore
          retention-days: 14
      # Artifact name `spans` is the `ci-lab telemetry pull` default (sha256 digest-verified).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: spans
          path: out/spans/
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: evaluate
    if: needs.evaluate.outputs.accepted == 'true' || needs.evaluate.outputs.ledger_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sleep-publish
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sleep-bundle
          path: ${{ runner.temp }}/sleep-bundle
      - name: Validate bundle and open DRAFT PR (stdlib only, never merges)
        env:
          GH_TOKEN: ${{ github.token }}
          SLEEP_BASE_REF: ${{ github.ref_name }}
          SLEEP_RUN_ATTEMPT: ${{ github.run_attempt }}
          BUNDLE_DIR: ${{ runner.temp }}/sleep-bundle
        run: python3 -I scripts/sleep_publish.py --bundle "$BUNDLE_DIR"
