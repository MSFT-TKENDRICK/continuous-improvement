# SkillOpt-Sleep nightly (design C10, §11.3). Three jobs:
#   gate     - read-only: enough NEW reviewed tasks since last night? (usage threshold)
#   evaluate - read-only + copilot-requests: run one night, emit a digest-pinned bundle
#   publish  - write: stdlib-only validator applies the bundle to a branch and opens a DRAFT PR
# Nothing is ever merged automatically; state.json advances only when a human merges the PR.
name: sleep-nightly

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch: {}

concurrency:
  group: sleep-nightly
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      new_reviewed: ${{ steps.gate.outputs.new_reviewed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - id: gate
        env:
          SLEEP_USAGE_THRESHOLD: ${{ vars.SLEEP_USAGE_THRESHOLD }}
          SLEEP_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: uv run ci-lab sleep usage-gate

  evaluate:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      accepted: ${{ steps.night.outputs.accepted }}
      ledger_update: ${{ steps.night.outputs.ledger_update }}
      status: ${{ steps.night.outputs.status }}
    env:
      CI_RUN_DIR: ${{ runner.temp }}/sleep-run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - name: Start agl-server (loopback, random key)
        run: |
          key="$(openssl rand -hex 24)"
          echo "::add-mask::$key"
          echo "CI_LAB_AGL_KEY=$key" >> "$GITHUB_ENV"
          echo "CI_LAB_AGL_URL=http://127.0.0.1:4747" >> "$GITHUB_ENV"
          mkdir -p "$CI_RUN_DIR"
          CI_LAB_AGL_KEY="$key" nohup uv run python -m agentlightning.server host=127.0.0.1 port=4747 \
            'key=${oc.env:CI_LAB_AGL_KEY}' hydra.run.dir=. hydra.output_subdir=null \
            hydra/job_logging=disabled hydra/hydra_logging=disabled > "$CI_RUN_DIR/agl-server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4747/healthz > /dev/null && exit 0
            sleep 1
          done
          echo "agl-server did not become healthy" >&2
          exit 1
      - id: night
        name: Run one SkillOpt-Sleep night
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: uv run ci-lab sleep run --profile copilot --out out/sleep-bundle --run-dir "$CI_RUN_DIR" --max-minutes 60
      - name: Redact night spans (replay with `ci-lab telemetry import`)
        if: ${{ !cancelled() }}
        run: uv run ci-lab sleep redact-spans --run-dir "$CI_RUN_DIR" --out out/sleep-spans/spans-redacted.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sleep-bundle
          path: out/sleep-bundle/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sleep-spans
          path: out/sleep-spans/
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: evaluate
    if: needs.evaluate.outputs.accepted == 'true' || needs.evaluate.outputs.ledger_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sleep-publish
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sleep-bundle
          path: ${{ runner.temp }}/sleep-bundle
      - name: Validate bundle and open DRAFT PR (stdlib only, never merges)
        env:
          GH_TOKEN: ${{ github.token }}
          SLEEP_BASE_REF: ${{ github.ref_name }}
          SLEEP_RUN_ATTEMPT: ${{ github.run_attempt }}
          BUNDLE_DIR: ${{ runner.temp }}/sleep-bundle
        run: python3 -I scripts/sleep_publish.py --bundle "$BUNDLE_DIR"
