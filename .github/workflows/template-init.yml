# One-click `ci-lab template init` for a repository created from this template (docs/template.md).
# Manual only (workflow_dispatch: only users with write access can run it). One job, no model, no
# uv/third-party code: system Python runs scripts/template_init.py (stdlib only), which rewrites
# CODEOWNERS, resets the template's history and writes .github/template.yml, then the changes are
# pushed to template-init/<run id> with a PR for a human to review and merge. Nothing merges itself.
# It never touches .github/workflows, so GITHUB_TOKEN can push the branch. In the template itself the
# script refuses (exit 2). Opening the PR needs "Allow GitHub Actions to create and approve pull
# requests" (Settings > Actions > General); otherwise open it from the pushed branch by hand.
name: template-init

on:
  workflow_dispatch:
    inputs:
      owners:
        description: 'CODEOWNERS owners, e.g. "@my-org/agent-owners @alice" (space separated)'
        required: true
        type: string
      reset_state:
        description: also empty the example agent's reviewed sleep tasks and held-out look ledger
        required: false
        type: boolean
        default: false

concurrency:
  group: template-init
  cancel-in-progress: false

permissions: {}

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      REPO: ${{ github.repository }}
      OWNERS: ${{ inputs.owners }}
      RESET_STATE: ${{ inputs.reset_state }}
      BASE: ${{ github.ref_name }}
      BRANCH: template-init/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan (dry run)
        run: |
          args=(--repo "$REPO" --owners "$OWNERS")
          if [ "$RESET_STATE" = "true" ]; then args+=(--reset-state); fi
          python3 -I -B scripts/template_init.py "${args[@]}"
      - name: Apply
        run: |
          args=(--repo "$REPO" --owners "$OWNERS")
          if [ "$RESET_STATE" = "true" ]; then args+=(--reset-state); fi
          python3 -I -B scripts/template_init.py "${args[@]}" --apply
      - name: Push branch and open PR (never merges)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice title=Nothing to do::already initialized"
            exit 0
          fi
          git switch -c "$BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Initialize repository from the ci-lab template" \
            -m "Ran: ci-lab template init (workflow template-init). Review CODEOWNERS before merging."
          gh auth setup-git
          git push origin "$BRANCH"
          body="Generated by \`ci-lab template init\` (workflow template-init). Review the CODEOWNERS owners and
          the reset template history, then merge. PRs opened by GITHUB_TOKEN do not trigger other workflows:
          close and reopen this PR (or push to it) to run tests/lint. Next: docs/template.md."
          if ! gh pr create --base "$BASE" --head "$BRANCH" --title "Initialize repository from the ci-lab template" \
            --body "$body"; then
            echo "::warning title=PR not created::pushed $BRANCH; open the PR by hand (or allow GitHub Actions to create pull requests)"
          fi
