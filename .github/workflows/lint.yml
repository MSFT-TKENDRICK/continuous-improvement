# R5 dev-loop lint (design §13.1, §13.4): lessons encoded as rules in lint/rules/*.yaml.
# Authoritative gate — the local pre-commit hook can be skipped with --no-verify, this cannot.
name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - name: uv sync
        run: uv sync
      - name: ci-lab lint
        run: uv run python -m ci_lab.lint lint
