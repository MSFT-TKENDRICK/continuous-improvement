format: ci_lab.harness.dataset.v1
suite_root: evals/assert
fixture_root: evals/fixtures/harness
rubric_root: evals/rubrics/harness
budget_source:
  manifest: src/ci_lab/harness_tree/manifest.yaml
  key: caps.eval
tiers:
  ci:
    profile: fake
    k: 1
    selection: all
    judge: fake
  evolve:
    profile: live
    k: 1
    split: evolve
    max_cases_per_suite: 3
  confirm:
    profile: live
    k: 2
    split: heldout
    finalists_only: true
critical_suites: [harness_injection]
