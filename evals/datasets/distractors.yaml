# Task-irrelevant state fields for the distractor probe. Reviewed to contain no claims about
# orders, refunds, policy, PII, or instructions, so no verdict should change when they are added.
- key: store_announcement
  text: >-
    Holiday hours: all Northwind Outdoor stores close at 5pm on December 24 and reopen at 10am on
